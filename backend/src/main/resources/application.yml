spring:
  application:
    name: snapshop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snapshop}
    username: ${DB_USERNAME:snapshop}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    user:
      name: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}

server:
  port: ${PORT:8080}
