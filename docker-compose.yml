services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: snapshop
      POSTGRES_USER: snapshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapshop -d snapshop"]
      interval: 5s
      retries: 10

volumes:
  db-data:
