services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: snapshop
      POSTGRES_USER: snapshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapshop -d snapshop"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    profiles: ["app"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/snapshop
      DB_USERNAME: snapshop
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      IMPORT_INBOX_DIR: /app/inbox
      FEED_URL: ${FEED_URL:-}
    volumes:
      - ./inbox:/app/inbox
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    profiles: ["app"]
    environment:
      BACKEND_URL: http://backend:8080
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
